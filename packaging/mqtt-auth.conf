# mqtt-auth drop-in for /etc/mosquitto/conf.d/.
#
# Installed by the mqtt-auth package. Marked as a conffile so dpkg preserves
# your edits across upgrades. Edit values to suit your environment, then
# `systemctl restart mosquitto`.

# Every CONNECT must authenticate through the plugin.
allow_anonymous false

# auth_opt_* applies to every listener defined in the main mosquitto.conf.
# Set to true if you want a separate auth backend per listener.
per_listener_settings false

# Load the plugin. nfpm installs it at this exact path; don't move it
# unless you also edit this line.
auth_plugin /usr/lib/mosquitto/plugins/mqtt-auth.so

# === Required: identity service settings ====================================

# The `iss` claim the plugin will require. Tokens with any other issuer
# are rejected.
auth_opt_jwt_issuer https://id.swee.net

# JWKS URL. Defaults to {issuer}/.well-known/jwks.json if omitted.
auth_opt_jwt_jwks_url https://id.swee.net/.well-known/jwks.json

# === Tunables ===============================================================

# How long fetched JWKS keys are considered fresh. After this, the next
# CONNECT triggers a refetch.
auth_opt_jwt_jwks_cache_ttl 5m

# Minimum interval between JWKS refetches triggered by an unknown kid.
# Stops a bad-token storm from stampeding the identity service.
auth_opt_jwt_jwks_refetch_min 10s

# HTTP request timeout for JWKS fetches.
auth_opt_jwt_http_timeout 10s

# Require the MQTT username field to equal the token's principal (`usr`
# for user tokens, `client_id` for service tokens). Defence against
# leaked-token impersonation. Disable only if you know what you're doing.
auth_opt_require_username_match true
