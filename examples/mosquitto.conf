# Example mosquitto.conf using the mqtt-auth plugin against id.swee.net.
#
# Adjust paths and listener port to match your deployment. This file is meant
# as a starting point; in production you'll layer TLS, persistence, and
# logging settings on top.

# --- Listener -----------------------------------------------------------------
# Plain TCP on 1883 for local testing. For internet-facing brokers, use 8883
# with `listener 8883 0.0.0.0` plus `certfile`/`keyfile`/`require_certificate`
# directives — this plugin does NOT terminate TLS, mosquitto does.
listener 1883 127.0.0.1

# --- Auth ---------------------------------------------------------------------
# allow_anonymous false plus our plugin means every CONNECT must carry a valid
# JWT in the password field; the username is checked against the token's
# `usr` claim (user tokens) or `client_id` claim (service tokens).
allow_anonymous false

# per_listener_settings false lets `auth_opt_*` directives below apply to
# every listener. Set to true if you want a separate auth backend per
# listener (e.g. anonymous metrics on 9001).
per_listener_settings false

# Load the plugin. Build with `make plugin`; copy bin/mqtt-auth.so to the
# broker host and adjust this path.
auth_plugin /etc/mosquitto/plugins/mqtt-auth.so

# Issuer is the value the plugin will require in the JWT's `iss` claim.
# Tokens with any other `iss` are rejected.
auth_opt_jwt_issuer https://id.swee.net

# JWKS URL is where the plugin fetches the verifying public key set.
# Identity serves this at /.well-known/jwks.json by default. Defaults to
# {issuer}/.well-known/jwks.json if omitted.
auth_opt_jwt_jwks_url https://id.swee.net/.well-known/jwks.json

# How long fetched keys are considered fresh. After this, the next CONNECT
# triggers a refetch. Key rotations also propagate automatically on the next
# unknown-kid token (refetches are throttled by jwt_jwks_refetch_min to one
# every 10s if the kid keeps missing).
auth_opt_jwt_jwks_cache_ttl 5m
auth_opt_jwt_jwks_refetch_min 10s

# Timeout on each JWKS HTTP request. Set generously — if the identity service
# is briefly slow we want to wait rather than fail-open, and refetches happen
# off the hot path.
auth_opt_jwt_http_timeout 10s

# require_username_match true (default): the MQTT username field must equal
# the token's principal — `usr` for user tokens, `client_id` for service
# tokens. Stops a leaked token authenticating as a different MQTT identity.
auth_opt_require_username_match true

# --- Logging ------------------------------------------------------------------
log_dest stderr
log_type all

# --- Persistence --------------------------------------------------------------
# Disabled here to keep this example minimal. For real deployments:
#   persistence true
#   persistence_location /var/lib/mosquitto/
