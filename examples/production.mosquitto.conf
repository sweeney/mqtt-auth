# Production mosquitto.conf with TLS, persistence, and the mqtt-auth plugin.
#
# Not installed by the package — copy to /etc/mosquitto/mosquitto.conf,
# adjust paths/certs/hostnames, then `systemctl restart mosquitto`.
#
# This is a starting point hardened against the obvious foot-guns. Audit
# it against your own threat model before relying on it.

# === Listeners ================================================================
# TLS-only for the public listener. Plain MQTT (1883) on loopback only for
# local administration via mosquitto_pub/sub.

listener 8883 0.0.0.0
protocol mqtt

# Full paths — mosquitto can't expand $HOME or ~.
cafile      /etc/mosquitto/certs/ca.crt
certfile    /etc/mosquitto/certs/server.crt
keyfile     /etc/mosquitto/certs/server.key

# Refuse old TLS versions and weak ciphers. Bump as needed; this is OK as
# of writing.
tls_version tlsv1.3
require_certificate false        # client certs not required; auth is via JWT in password field

# Optional: an additional plain-TCP listener bound to loopback for local
# admin tooling (e.g. mosquitto_pub from cron). Remove if not needed.
listener 1883 127.0.0.1

# === Auth ====================================================================
# Provided by /etc/mosquitto/conf.d/10-mqtt-auth.conf installed by the
# mqtt-auth package. Lines below are duplicates of that drop-in for
# completeness if you've inlined everything in this file instead.
#
# allow_anonymous false
# per_listener_settings false
# auth_plugin /usr/lib/mosquitto/plugins/mqtt-auth.so
# auth_opt_jwt_issuer https://id.swee.net
# auth_opt_jwt_jwks_url https://id.swee.net/.well-known/jwks.json
# auth_opt_require_username_match true

# === Persistence =============================================================
# Retained messages and QoS 1/2 in-flight survive restarts.

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60                     # seconds between autosaves
autosave_on_changes false

# === Logging =================================================================
# stderr → captured by journald via systemd. log_type all is noisy in busy
# brokers; trim to `notice error warning` in steady state.

log_dest stderr
log_type notice
log_type warning
log_type error
log_type information
log_timestamp true
connection_messages true

# === Limits ==================================================================
# Reasonable defaults for a small/medium broker. Tune up for fleet-scale.

max_connections -1                       # unlimited; cap if you don't trust your TLS layer to rate-limit
max_inflight_messages 20
max_queued_messages 1000
max_packet_size 1048576                  # 1 MiB; bump if you publish large payloads

# Reject CONNECTs that try to claim a clientid already in use without taking
# over (helps fail-fast in misconfigured fleets).
allow_zero_length_clientid false

# === Sysvinit-style PID + user ==============================================
# systemd unit shipped with mosquitto on Debian sets these; uncomment if
# running outside the packaged init.
#
# pid_file /run/mosquitto/mosquitto.pid
# user mosquitto
