name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ./plugin needs cgo + mosquitto headers; vet/test it in the cgo-build job.
      # This job is pure-Go and runs on a vanilla runner.
      - name: go vet
        run: |
          set +e
          out=$(go vet ./internal/... ./cmd/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## go vet failed"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi

      - name: Unit tests with race detector
        run: |
          set +e
          out=$(go test -race -coverprofile=coverage.out ./internal/... ./cmd/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## go test failed"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi
          echo "$out"

      - name: Build mqtt-auth-verify CLI
        run: make verify

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Run staticcheck
        run: |
          set +e
          ver=$($(go env GOPATH)/bin/staticcheck -version)
          # ./plugin needs cgo + mosquitto headers; lint it in the cgo-build job.
          out=$($(go env GOPATH)/bin/staticcheck ./internal/... ./cmd/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## staticcheck failed"
              echo "Version: $ver"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi
          echo "$ver"
          echo "$out"

  cgo-build:
    name: cgo plugin builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mosquitto + plugin headers
        # The plugin builds against libmosquitto-dev/mosquitto-dev. The
        # mosquitto package itself is needed so dpkg can satisfy our
        # .deb's `Depends: mosquitto` during the install roundtrip below.
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-dev libmosquitto-dev
          sudo systemctl stop mosquitto || true

      - name: go vet ./plugin
        run: go vet ./plugin/...

      - name: Plugin cgo tests
        run: go test -tags=mqttauth_plugintest -v ./plugin/...

      - name: Build mqtt-auth.so
        run: make plugin

      - name: Verify exported symbols
        run: |
          nm -D bin/mqtt-auth.so | grep -E "mosquitto_auth_(plugin_version|plugin_init|plugin_cleanup|unpwd_check|acl_check|security_init|security_cleanup)"

      - name: Install nfpm and envsubst
        # `make package` builds the .deb. nfpm produces it from packaging/nfpm.yaml
        # after envsubst expands $VERSION. Both are cheap installs (~5s combined).
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
          sudo apt-get install -y gettext-base
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .deb (smoke test)
        run: VERSION=0.0.0-ci make package

      - name: apt-install / dpkg -r roundtrip
        # Use apt-get to install: it resolves the mosquitto dep cleanly
        # even when the runner has mosquitto in a half-configured state
        # (postinst service-start can fail on minimal CI runners without
        # a fully usable systemd, leaving dpkg unhappy). `apt install
        # ./local.deb` is the documented way to install local packages.
        run: |
          set -ex
          sudo apt-get install -y "./dist/mqtt-auth_0.0.0-ci_amd64.deb"
          [ -f /usr/lib/mosquitto/plugins/mqtt-auth.so ]
          [ -x /usr/bin/mqtt-auth-verify ]
          [ -f /etc/mosquitto/conf.d/10-mqtt-auth.conf ]
          dpkg -L mqtt-auth
          sudo dpkg -r mqtt-auth

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-auth-plugin
          path: bin/mqtt-auth.so

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-auth-deb
          path: dist/*.deb

  fuzz:
    name: Fuzz (30s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz JWT parse path
        run: go test ./internal/auth/ -run='^$' -fuzz=FuzzVerifierParse -fuzztime=30s

  e2e:
    name: End-to-end (real mosquitto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mosquitto + plugin headers
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-dev libmosquitto-dev
          # The package starts a system mosquitto on :1883 — stop it so our
          # ephemeral-port instances are the only brokers running.
          sudo systemctl stop mosquitto || true
          mosquitto -h | head -1

      - name: Build plugin
        run: make plugin

      - name: Run e2e suite
        run: |
          set +e
          out=$(go test -tags=e2e -v ./test/e2e/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## e2e failed"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi
          echo "$out"
