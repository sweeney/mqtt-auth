name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ./plugin needs cgo + mosquitto headers; vet/test it in the cgo-build job.
      # This job is pure-Go and runs on a vanilla runner.
      - name: go vet
        run: |
          set +e
          out=$(go vet ./internal/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## go vet failed"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi

      - name: Unit tests with race detector
        run: |
          set +e
          out=$(go test -race -coverprofile=coverage.out ./internal/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## go test failed"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi
          echo "$out"

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Run staticcheck
        run: |
          set +e
          ver=$($(go env GOPATH)/bin/staticcheck -version)
          # ./plugin needs cgo + mosquitto headers; lint it in the cgo-build job.
          out=$($(go env GOPATH)/bin/staticcheck ./internal/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## staticcheck failed"
              echo "Version: $ver"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi
          echo "$ver"
          echo "$out"

  cgo-build:
    name: cgo plugin builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mosquitto plugin headers
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto-dev libmosquitto-dev

      - name: go vet ./plugin
        run: go vet ./plugin/...

      - name: Plugin cgo tests
        run: go test -tags=mqttauth_plugintest -v ./plugin/...

      - name: Build mqtt-auth.so
        run: make plugin

      - name: Verify exported symbols
        run: |
          nm -D bin/mqtt-auth.so | grep -E "mosquitto_auth_(plugin_version|plugin_init|plugin_cleanup|unpwd_check|acl_check|security_init|security_cleanup)"

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-auth-plugin
          path: bin/mqtt-auth.so

  fuzz:
    name: Fuzz (30s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz JWT parse path
        run: go test ./internal/auth/ -run='^$' -fuzz=FuzzVerifierParse -fuzztime=30s

  e2e:
    name: End-to-end (real mosquitto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mosquitto + plugin headers
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-dev libmosquitto-dev
          # The package starts a system mosquitto on :1883 — stop it so our
          # ephemeral-port instances are the only brokers running.
          sudo systemctl stop mosquitto || true
          mosquitto -h | head -1

      - name: Build plugin
        run: make plugin

      - name: Run e2e suite
        run: |
          set +e
          out=$(go test -tags=e2e -v ./test/e2e/... 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## e2e failed"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit $rc
          fi
          echo "$out"
