name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run staticcheck
        run: staticcheck ./...

  cgo-build:
    name: cgo plugin builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mosquitto plugin headers
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto-dev libmosquitto-dev

      - name: Build mqtt-auth.so
        run: make plugin

      - name: Verify exported symbols
        run: |
          nm -D bin/mqtt-auth.so | grep -E "mosquitto_auth_(plugin_version|plugin_init|plugin_cleanup|unpwd_check|acl_check|security_init|security_cleanup)"

      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-auth-plugin
          path: bin/mqtt-auth.so

  fuzz:
    name: Fuzz (30s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz JWT parse path
        run: go test ./internal/auth/ -run='^$' -fuzz=FuzzVerifierParse -fuzztime=30s
